name: Update player
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-player.js
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/player.json
          git diff --cached --quiet || (git commit -m "Update player" && git push)